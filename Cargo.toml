[workspace]
resolver = "3"
members = ["crates/world", "crates/viewer", "crates/drone_spec", "crates/sensors", "crates/mapping", "crates/planning", "crates/estimation", "crates/sim", "crates/bench"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
world = { path = "crates/world" }

# Bevy is slow in debug builds: optimize dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
